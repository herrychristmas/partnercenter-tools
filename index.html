<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파트너센터용 변환기</title>
<style>
:root{--blue:#2890ff;--blue2:#1477dc;--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fb;--side:#0f172a;--side2:#111c34;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit}.shell{display:grid;grid-template-columns:268px minmax(0,1fr);height:100vh;overflow:hidden}.sidebar{background:linear-gradient(180deg,var(--side),var(--side2));color:#fff;padding:22px 16px;display:flex;flex-direction:column;min-height:0}.brand{padding:8px 10px 22px;border-bottom:1px solid rgba(255,255,255,.1)}.brand-badge{display:inline-flex;align-items:center;gap:7px;color:#a9cfff;font-size:11px;font-weight:850;letter-spacing:.08em}.brand-badge:before{content:"";width:8px;height:8px;border-radius:50%;background:#4da3ff;box-shadow:0 0 0 4px rgba(77,163,255,.15)}.brand h1{font-size:22px;margin:10px 0 5px;letter-spacing:-.04em}.brand p{margin:0;color:#94a3b8;font-size:12px;line-height:1.55}.nav-label{padding:22px 10px 9px;color:#64748b;font-size:11px;font-weight:850;letter-spacing:.08em}.nav{display:flex;flex-direction:column;gap:7px}.nav-btn{width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px 12px;border-radius:12px;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;transition:.18s}.nav-btn svg{width:19px;height:19px;flex:0 0 19px}.nav-btn strong{display:block;font-size:13px}.nav-btn span{display:block;margin-top:2px;font-size:10.5px;color:#7f8da5}.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}.nav-btn.active{background:linear-gradient(135deg,#2890ff,#1f7ce0);color:#fff;box-shadow:0 10px 24px rgba(0,84,190,.25)}.nav-btn.active span{color:#dbeafe}.coming{opacity:.48;cursor:default}.sidebar-foot{margin-top:auto;padding:14px 10px 4px;color:#64748b;font-size:10.5px;line-height:1.6}.main{min-width:0;height:100vh;display:flex;flex-direction:column}.topbar{height:64px;flex:0 0 64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top-title{display:flex;align-items:center;gap:11px;min-width:0}.mobile-menu{display:none;border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;cursor:pointer}.top-title h2{font-size:17px;margin:0;letter-spacing:-.025em}.top-title p{margin:3px 0 0;color:var(--muted);font-size:11px}.open-new{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:10px;padding:9px 12px;font-weight:800;font-size:12px;cursor:pointer}.open-new:hover{border-color:var(--blue);color:var(--blue)}.stage{position:relative;flex:1;min-height:0;background:#eef2f6}.tool-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f6f8fb;color:#667085;font-size:13px;z-index:2}.loading.hide{display:none}.shade{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:20;transform:translateX(-100%);transition:.2s}.shell.menu-open .sidebar{transform:translateX(0)}.mobile-menu{display:flex}.shade{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:15}.shell.menu-open .shade{display:block}.topbar{padding:0 14px}.top-title p{display:none}.open-new{padding:8px 10px}.main{height:100vh}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">WORK TOOL</div>
      <h1>파트너센터용 변환기</h1>
      <p>반복 제작 업무를 한곳에서 처리하는<br>내부 작업 도구입니다.</p>
    </div>
    <div class="nav-label">TOOLS</div>
    <nav class="nav">
      <button class="nav-btn active" data-tool="newsletter" data-url="tools/newsletter.html" data-title="뉴스레터 변환기" data-desc="DM HTML을 파트너센터 게시용으로 변환합니다.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><div><strong>뉴스레터 변환기</strong><span>DM → 파트너센터 HTML</span></div>
      </button>
      <button class="nav-btn" data-tool="trend" data-url="tools/Trend_Report_Generator_v17_fixed.html" data-title="트렌드 리포트 변환기" data-desc="트렌드 리포트 이미지와 콘텐츠를 제작합니다.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg><div><strong>트렌드 리포트 변환기</strong><span>리포트 제작 및 이미지 저장</span></div>
      </button>
    </nav>
    <div class="nav-label">COMING SOON</div>
    <nav class="nav">
      <button class="nav-btn coming" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h8M8 12h5M8 16h7"/></svg><div><strong>카드 생성기</strong><span>준비 중</span></div></button>
      <button class="nav-btn coming" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg><div><strong>이미지 변환기</strong><span>준비 중</span></div></button>
    </nav>
    <div class="sidebar-foot">각 도구는 독립 파일로 유지되어<br>기존 기능과 디자인이 그대로 보존됩니다.</div>
  </aside>
  <div class="shade" id="shade"></div>
  <main class="main">
    <header class="topbar">
      <div class="top-title"><button class="mobile-menu" id="menuBtn" aria-label="메뉴 열기">☰</button><div><h2 id="pageTitle">뉴스레터 변환기</h2><p id="pageDesc">DM HTML을 파트너센터 게시용으로 변환합니다.</p></div></div>
      <button class="open-new" id="openNew">새 창에서 열기 ↗</button>
    </header>
    <section class="stage"><div class="loading" id="loading">도구를 불러오는 중입니다.</div><iframe class="tool-frame" id="toolFrame" src="tools/newsletter.html" title="뉴스레터 변환기"></iframe></section>
  </main>
</div>
<script>
const shell=document.getElementById('shell'),frame=document.getElementById('toolFrame'),loading=document.getElementById('loading'),title=document.getElementById('pageTitle'),desc=document.getElementById('pageDesc');
let currentUrl='tools/newsletter.html';
function openTool(btn){if(!btn||btn.disabled)return;document.querySelectorAll('.nav-btn[data-url]').forEach(x=>x.classList.toggle('active',x===btn));currentUrl=btn.dataset.url;title.textContent=btn.dataset.title;desc.textContent=btn.dataset.desc;frame.title=btn.dataset.title;loading.classList.remove('hide');frame.src=currentUrl;history.replaceState(null,'','#'+btn.dataset.tool);shell.classList.remove('menu-open')}
document.querySelectorAll('.nav-btn[data-url]').forEach(btn=>btn.addEventListener('click',()=>openTool(btn)));
frame.addEventListener('load',()=>loading.classList.add('hide'));
document.getElementById('openNew').onclick=()=>window.open(currentUrl,'_blank','noopener');
document.getElementById('menuBtn').onclick=()=>shell.classList.toggle('menu-open');document.getElementById('shade').onclick=()=>shell.classList.remove('menu-open');
const hash=location.hash.replace('#','');if(hash){const target=document.querySelector(`[data-tool="${hash}"]`);if(target)openTool(target)}
</script>
</body>
</html>
